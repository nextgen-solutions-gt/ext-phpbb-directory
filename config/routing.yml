    defaults:
        _controller: nextgen.phpbbdirectory.controller.categories:return_slug

nextgen_phpbbdirectory_banner_route:
    path: /directory/banner/{banner_img}
    defaults: 
        _controller: nextgen.phpbbdirectory.controller.links:return_banner

nextgen_phpbbdirectory_search_controller:
    path: /directory/search/{page}
    defaults:
        _controller: nextgen.phpbbdirectory.controller.search:main
        page: 1
    requirements:
        page: \d+