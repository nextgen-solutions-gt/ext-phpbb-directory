imports:
    - { resource: cron_tasks.yml }
    - { resource: notifications.yml }
    - { resource: tables.yml }

services:
    # --- ACP Controllers ---
    nextgen.phpbbdirectory.controller.acp.main:
        class: nextgen\phpbbdirectory\controller\acp\main
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@dbal.conn'
            - '@language'
            - '@request'
            - '@template'
            - '%core.root_path%'
            - '@config'

    nextgen.phpbbdirectory.controller.acp.cat:
        class: nextgen\phpbbdirectory\controller\acp\cat
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@cache'
            - '@dbal.conn'
            - '@controller.helper'
            - '@language'
            - '@log'
            - '@request'
            - '@template'
            - '@user'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.nestedset_category'

    nextgen.phpbbdirectory.controller.acp.settings:
        class: nextgen\phpbbdirectory\controller\acp\settings
        autowire: true

    nextgen.phpbbdirectory.controller.acp.validation:
        class: nextgen\phpbbdirectory\controller\acp\validation
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@pagination'
            - '@language'
            - '@log'
            - '@notification_manager'
            - '@request'
            - '@template'
            - '@user'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.link'
            - '%core.root_path%'
            - '%core.php_ext%'

    # --- Frontend Controllers ---
    nextgen.phpbbdirectory.controller.categories:
        class: nextgen\phpbbdirectory\controller\categories
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@pagination'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.link'

    nextgen.phpbbdirectory.controller.links:
        class: nextgen\phpbbdirectory\controller\links
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@captcha.factory'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.link'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@files.factory'

    nextgen.phpbbdirectory.controller.comments:
        class: nextgen\phpbbdirectory\controller\comments
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@pagination'
            - '@captcha.factory'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.comment'
            - '%core.root_path%'
            - '%core.php_ext%'

    nextgen.phpbbdirectory.controller.search:
        class: nextgen\phpbbdirectory\controller\search
        parent: nextgen.phpbbdirectory.core.helper
        public: true
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@pagination'
            - '@nextgen.phpbbdirectory.search.fulltext_directory'
            - '@nextgen.phpbbdirectory.core.categorie'
            - '@nextgen.phpbbdirectory.core.link'

    # --- Event Listeners ---
    nextgen.phpbbdirectory.event.listener:
        class: nextgen\phpbbdirectory\event\listener
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'
            - '@controller.helper'
            - '@language'
            - '@template'
            - '%core.table_prefix%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    # --- Core Services ---
    nextgen.phpbbdirectory.core.categorie:
        class: nextgen\phpbbdirectory\core\categorie
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@cron.manager'

    nextgen.phpbbdirectory.core.cron:
        class: nextgen\phpbbdirectory\core\cron
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@log'
            - '@user'
            - '@notification_manager'
            - '@nextgen.phpbbdirectory.core.link'
            - '%core.root_path%'
            - '%core.php_ext%'

    nextgen.phpbbdirectory.core.link:
        class: nextgen\phpbbdirectory\core\link
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@template'
            - '@user'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '@notification_manager'
            - '@filesystem'
            - '@upload_imagesize' 
            - '@files.upload'
            - '%core.root_path%'
            - '%core.php_ext%'

    nextgen.phpbbdirectory.core.comment:
        class: nextgen\phpbbdirectory\core\comment
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'
            - '@language'

    nextgen.phpbbdirectory.core.helper:
        class: nextgen\phpbbdirectory\core\helper
        abstract: true
        calls:
            - [set_extension_manager, ['@ext.manager']]
            - [set_path_helper, ['@path_helper']]
            - [set_tables, ['%tables.dir.categories%','%tables.dir.comments%','%tables.dir.links%','%tables.dir.votes%','%tables.dir.watch%']]

    nextgen.phpbbdirectory.core.nestedset_category:
        class: nextgen\phpbbdirectory\core\nestedset_category
        arguments:
            - '@dbal.conn'
            - '@nextgen.phpbbdirectory.table_lock'
            - '%tables.dir.categories%'

    nextgen.phpbbdirectory.routing.loader:
        class: nextgen\phpbbdirectory\routing\categories_loader
        arguments:
            - '@dbal.conn'
            - '%tables.dir.categories%'
        tags:
            - { name: routing.loader }

    nextgen.phpbbdirectory.search.fulltext_directory:
        class: nextgen\phpbbdirectory\search\fulltext_directory
        parent: nextgen.phpbbdirectory.core.helper
        arguments:
            - '@dbal.conn'

    nextgen.phpbbdirectory.table_lock:
        class: phpbb\lock\db
        arguments:
            - nextgen.phpbbdirectory.table_lock.directory_cats
            - '@config'
            - '@dbal.conn'