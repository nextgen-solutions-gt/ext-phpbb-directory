services:
    nextgen.phpbbdirectory.text_reparser.cat_description:
        class: nextgen\phpbbdirectory\textreparser\plugins\cat_description
        arguments:
            - '@dbal.conn'
            - '%tables.dir.categories%'
        tags:
            - { name: text_reparser.plugin }

    nextgen.phpbbdirectory.text_reparser.comment_text:
        class: nextgen\phpbbdirectory\textreparser\plugins\comment_text
        arguments:
            - '@dbal.conn'
            - '%tables.dir.comments%'
        tags:
            - { name: text_reparser.plugin }

    nextgen.phpbbdirectory.text_reparser.link_description:
        class: nextgen\phpbbdirectory\textreparser\plugins\link_description
        arguments:
            - '@dbal.conn'
            - '%tables.dir.links%'
        tags:
            - { name: text_reparser.plugin }