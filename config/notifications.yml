services:
     nextgen.phpbbdirectory.notification.type.directory_website_in_queue:
        class: nextgen\phpbbdirectory\notification\type\directory_website_in_queue
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
        tags:
            - { name: notification.type }

     nextgen.phpbbdirectory.notification.type.directory_website:
        class: nextgen\phpbbdirectory\notification\type\directory_website
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_controller_helper, ['@controller.helper']]
            - [set_watch_table, ['%tables.dir.watch%']]
        tags:
            - { name: notification.type }

     nextgen.phpbbdirectory.notification.type.directory_website_approved:
        class: nextgen\phpbbdirectory\notification\type\directory_website_approved
        shared: false
        parent: notification.type.base
        calls:
            - [set_controller_helper, ['@controller.helper']]
        tags:
            - { name: notification.type }

     nextgen.phpbbdirectory.notification.type.directory_website_disapproved:
        class: nextgen\phpbbdirectory\notification\type\directory_website_disapproved
        shared: false
        parent: notification.type.base
        tags:
            - { name: notification.type }

     nextgen.phpbbdirectory.notification.type.directory_website_error_cron:
        class: nextgen\phpbbdirectory\notification\type\directory_website_error_cron
        shared: false
        parent: notification.type.base
        tags:
            - { name: notification.type }